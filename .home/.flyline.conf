# ~/.flyline.conf: sourced from ~/.local.bashrc. Turns on flyline -- a
# replacement line editor for bash, loaded as a builtin out of the shared
# library that start_fresh.sh installs -- and configures it.
#
# Flyline has no config file of its own: every setting is a subcommand of the
# `flyline` builtin and none of it persists between shells, so this whole file
# re-runs in each interactive shell. To work out what belongs here, change
# things interactively and then run `flyline settings`, which prints just what
# the session has moved off its defaults; `flyline key list` does the same for
# keys, and flags any binding shadowed by a later one as INACCESSIBLE.

################################################################################
# Load.
################################################################################

# Nothing to drive in an Emacs TRAMP shell, and nothing to load before
# start_fresh.sh has installed the library.
[[ "$TERM" != "dumb" ]] || return 0
[ -e ~/.local/lib/libflyline.so ] || return 0

# `enable flyline` on its own succeeds once the builtin has been loaded, so
# re-sourcing this file does not reload the library.
enable flyline 2>/dev/null ||
	enable -f ~/.local/lib/libflyline.so flyline || return 0

################################################################################
# Cursor.
################################################################################

# Flyline draws its own cursor and, by default, fades it in and out forever.
# Hold it at full brightness instead. This is the animation only: the cursor
# still slides to its new position, which is `--interpolate`.
flyline set-cursor --effect none

################################################################################
# Keys.
################################################################################

# Flyline handles key events itself instead of going through readline, so
# readline's emacs bindings are gone with it -- including Ctrl+p and Ctrl+n for
# history. Flyline binds neither, so mirror onto them everything it binds on Up
# and Down. `flyline key list` prints those, and prints them from lowest to
# highest priority, which is the order they are repeated in here: a later
# binding of the same key wins over an earlier one.
#
# Bindings accumulate rather than replace, so re-sourcing this file would
# otherwise add a second copy of each one.
if [ -z "${flyline_keys_bound:-}" ]; then
	flyline_keys_bound=1

	# Ctrl+p mirrors Up.
	flyline key bind Ctrl+p always=prevHistoryEntry
	flyline key bind Ctrl+p '!cursorOnFirstLine=moveLineUp'
	flyline key bind Ctrl+p fuzzyHistorySearch=fuzzyHistorySelectPrev
	flyline key bind Ctrl+p userTriggeredSuggestions=tabCompletionMoveUp
	flyline key bind Ctrl+p '!userTriggeredSuggestions+tabCompletionEntrySelected=tabCompletionMoveUp'
	flyline key bind Ctrl+p agentOutputSelection=agentOutputSelectPrev
	flyline key bind Ctrl+p tabCompletionFlycompResult=escapeToNormalMode
	flyline key bind Ctrl+p tabCompletionAskForFlycomp=flycompAskPrevChoice

	# Ctrl+n mirrors Down.
	flyline key bind Ctrl+n always=nextHistoryEntry
	flyline key bind Ctrl+n '!cursorOnFinalLine=moveLineDown'
	flyline key bind Ctrl+n fuzzyHistorySearch=fuzzyHistorySelectNext
	flyline key bind Ctrl+n tabCompletionAvailable=tabCompletionMoveDown
	flyline key bind Ctrl+n agentOutputSelection=agentOutputSelectNext
	flyline key bind Ctrl+n tabCompletionFlycompResult=escapeToNormalMode
	flyline key bind Ctrl+n tabCompletionAskForFlycomp=flycompAskNextChoice
fi
