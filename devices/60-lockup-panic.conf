# Turn a wedged machine into a panic, so that it leaves a trace behind.
#
# A hard lockup writes nothing. The journal syncs every 10s and
# zz-sleep-forensics forces a sync in early resume, so the record is complete
# right up to the moment the machine stops -- and then there is simply nothing,
# not even the background chatter that runs unconditionally. That is how the
# 2026-09-14 and 2026-09-15 resume failures are known to be lockups rather than
# a dead compositor, and also why they cannot be diagnosed any further: the
# thing that would explain them never got written.
#
# The kernel already watches for this. NMI watchdog is on ("NMI watchdog:
# Enabled. Permanently consumes one hw-PMU counter." at boot), watchdog_thresh
# is 10, and efi_pstore is registered as the pstore backend. What was missing
# is the instruction to panic: on detection the kernel was only printing to a
# console nobody can read, on a machine that then has to be power-cycled.
#
# With these set, a lockup becomes: watchdog fires -> panic -> the tail of the
# kernel log is written to EFI variables by efi_pstore -> the machine reboots
# itself -> systemd-pstore.service archives the record into
# /var/lib/systemd/pstore/ and frees the variables again. Nothing has to be
# done at the keyboard, and the trace survives a power cut either way because
# it is in NVRAM rather than in RAM.
#
# Verify it end to end rather than trusting it, by causing a panic on purpose:
#
#     echo c | sudo tee /proc/sysrq-trigger
#
# The machine should reboot ~20s later and come back with a directory under
# /var/lib/systemd/pstore holding a dmesg.txt that ends in the panic. If it
# does not, nothing was captured, and the ramoops alternative at the bottom of
# this file is the next thing to try.
#
# Caveats worth knowing before reading a "nothing was captured" as meaning
# anything:
#
#   - This catches a CPU spinning with interrupts off (hard), a task that will
#     not yield (soft), and an oops. It cannot catch a machine that is already
#     electrically gone, or one wedged below the point where an NMI is
#     delivered -- a GPU that has taken the PCIe bus down with it, say.
#   - efivarfs on this board is 89% full (109K of 128K), and the kernel keeps
#     5K of that in reserve. A deflate-compressed 10K dmesg tail normally lands
#     in 2-4K, so it fits, but not by much.

# Hard lockup: a CPU has not run the watchdog for watchdog_thresh seconds with
# interrupts disabled. This is the one the resume failures look like.
kernel.hardlockup_panic = 1

# Soft lockup: a task has held a CPU without scheduling for 2*watchdog_thresh
# seconds. Catches the same failure when it leaves the rest of the machine
# limping rather than dead.
kernel.softlockup_panic = 1

# An oops in the resume path is worth stopping for. The machine survives some
# oopses, but it survives them into an undefined state, and the record of what
# went wrong is exactly what is missing. This is the line to comment out first
# if the NVIDIA module turns out to oops routinely and harmlessly; the kernel
# has not oopsed once so far (taint is 4096, out-of-tree module, nothing else).
kernel.panic_on_oops = 1

# Reboot 20s after a panic instead of sitting there. The delay is long enough
# to photograph the screen when the display happens to still be alive, and the
# pstore write has already happened by then. 0 would mean "wait forever", which
# is what left the previous lockups needing the power button.
kernel.panic = 20

# Deliberately NOT set: kernel.hung_task_panic. It would have caught the older
# console_lock deadlock that fbcon=nodefer fixed, but 120s in D state is also
# what a USB disk disappearing looks like -- and this machine has an HP dock
# that throws "xHC error in resume" and lost writes on sda1. A spurious panic
# costs a session. Turn it on for a run if a hung task is what is suspected:
#     sudo sysctl kernel.hung_task_panic=1

# ---------------------------------------------------------------------------
# If efi_pstore turns out to be too small: ramoops
# ---------------------------------------------------------------------------
#
# ramoops keeps the record in a reserved chunk of RAM instead of NVRAM, so
# there is no space limit worth worrying about. The trade is what it survives:
# RAM keeps its contents across a warm reboot and a front-panel reset, but not
# across holding the power button. That matters less than it sounds, because
# kernel.panic above makes the machine reboot itself -- but it does mean that
# if the watchdog never fires and the box just sits there, the recovery is the
# RESET button, not the power button.
#
# Whether this board actually preserves DRAM across a reset is a property of
# its firmware and is not knowable without trying it, so treat the test panic
# above as mandatory here rather than optional.
#
# Setup, all of which needs a reboot:
#
#   1. Add to GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub, then update-grub:
#
#        reserve_mem=8M:4096:oops ramoops.mem_name=oops
#        ramoops.record_size=1048576 ramoops.max_reason=2
#        pstore.backend=ramoops pstore.kmsg_bytes=262144
#
#      reserve_mem lets the kernel place the region itself and hand it to
#      ramoops by name; hardcoding a physical address is the older way and is
#      board-specific and easy to get wrong. pstore.backend is what stops
#      efi_pstore, which systemd modprobes early, from registering first.
#
#   2. echo ramoops | sudo tee /etc/modules-load.d/ramoops.conf
#      CONFIG_PSTORE_RAM is a module on Ubuntu and nothing else pulls it in.
#
#   3. Reboot, confirm with
#        cat /sys/module/pstore/parameters/backend      -> ramoops
#      then run the test panic.
#
# Note that ramoops' console_size is useless here: CONFIG_PSTORE_CONSOLE is not
# set in Ubuntu's kernel, so there is no continuous capture of the console to
# be had either way. Both backends only record when the kernel actually dumps,
# which is why the panic settings above are the part that does the work.
