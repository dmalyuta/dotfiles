# vim:fileencoding=utf-8:foldmethod=marker
#
# kitty terminal configuration.
#
# Only settings that differ from the defaults are listed. For everything else
# see https://sw.kovidgoyal.net/kitty/conf/, or press ctrl+shift+f6 to dump the
# fully resolved config. Reload a running instance with ctrl+shift+f5.

# Fonts {{{

# The family also ships ExtraLight/Light/SemiLight/SemiBold faces, so pin each
# style explicitly rather than letting kitty guess which weight is "bold".
font_family      family="CaskaydiaCove Nerd Font Mono" style=Regular
bold_font        family="CaskaydiaCove Nerd Font Mono" style=Bold
italic_font      family="CaskaydiaCove Nerd Font Mono" style=Italic
bold_italic_font family="CaskaydiaCove Nerd Font Mono" style="Bold Italic"
font_size        12.0

# }}}

# Cursor {{{

cursor_shape          block
cursor_blink_interval 0

# }}}

# Scrollback {{{

scrollback_lines 50000

# }}}

# Window layout {{{

# `splits` is the only layout that supports launch --location=vsplit/hsplit,
# which the Alt+w bindings below depend on.
enabled_layouts splits

remember_window_size  no
initial_window_width  1000
initial_window_height 700
window_padding_width  4

# Borders are drawn only once a window is split. Dimming inactive splits makes
# the focused one obvious at a glance.
window_border_width   1pt
active_border_color   #6699cc
inactive_border_color #444444
inactive_text_alpha   0.85

confirm_os_window_close 0

# }}}

# Colours {{{

background_opacity 0.85

# }}}

# Bell {{{

enable_audio_bell no

# }}}

# Advanced {{{

# Lets `kitten @` drive this instance from any program running inside it.
allow_remote_control yes

# Opens a single window in the splits layout; see ./default-kitty.
startup_session ./default-kitty

# }}}

# Keyboard shortcuts {{{

# Splits. Alt+w is a leader key, so the chords mirror the prefix bindings in
# ~/.tmux.conf: `|` puts windows side by side, `-` stacks them. New splits
# inherit the current directory, which relies on shell integration (on by
# default).
map alt+w>| launch --location=vsplit --cwd=current
map alt+w>- launch --location=hsplit --cwd=current
map alt+w>k close_window

# Move focus between splits. NOTE: tmux binds these same keys prefix-lessly
# (`bind -n M-Left ...`), so kitty swallows them when tmux runs inside kitty.
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Resize splits. The arrow key names the direction the split border moves, not
# whether the focused window grows: `resize_window narrower` alone means
# ctrl+left drags the border left in a left-hand window but right in a
# right-hand one. See ./resize_split.py. To instead make the arrow name the
# window that gains space ("ctrl+left grows whatever is on the left"), swap the
# left/right and up/down arguments below.
map ctrl+left  kitten resize_split.py left
map ctrl+right kitten resize_split.py right
map ctrl+up    kitten resize_split.py up
map ctrl+down  kitten resize_split.py down

# }}}
