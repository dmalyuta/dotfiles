# 176 (Ubuntu default) = sync + remount-ro + reboot.
# 1 = all functions, which adds the process and lock dumps that make an
# unresponsive resume diagnosable from the keyboard. Physical access only.
#
# Alt+SysRq+W  dump every task blocked in D state
# Alt+SysRq+L  dump the stack of every CPU
# Alt+SysRq+S  sync, committing both of the above to disk
kernel.sysrq = 1
