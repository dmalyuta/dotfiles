# Scanner backends that Wine programs load, through bin/pdf-xchange-editor's SANE_CONFIG_DIR.
#
# Wine's TWAIN bridge (sane.ds) runs SANE inside the program itself. With the system's full list,
# the USB scanner backends start libusb, whose USB hotplug thread then spins a CPU core at 100%
# under Wine after the PC wakes from sleep. The eSCL backend is network-only and doesn't start it.
airscan
