# Echo-cancelled webcam mic for recording calls played on the HDMI monitor speakers.
# The HDMI output's monitor is the echo reference (monitor.mode), so the default
# output stays unchanged. Use "Webcam Mic (echo cancelled)" as the mic in OBS / call apps.
#
# A template: start_fresh installs it to ~/.config/pipewire/pipewire.conf.d with @WEBCAM_MIC@
# replaced by the webcam's microphone on this machine.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name   = aec/libspa-aec-webrtc
      monitor.mode   = true
      audio.rate     = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = false
      }
      capture.props = {
        node.name     = "echo-cancel-capture"
        target.object = "@WEBCAM_MIC@"
        node.passive  = true
      }
      sink.props = {
        node.name     = "echo-cancel-reference"
        target.object = "alsa_output.pci-0000_01_00.1.hdmi-stereo"
        node.passive  = true
      }
      source.props = {
        node.name        = "echo-cancel-source"
        node.description = "Webcam Mic (echo cancelled)"
      }
    }
  }
]
