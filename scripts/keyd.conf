# Key remaps that KDE has no setting for, done by keyd below the display server. Installed to
# /etc/keyd/default.conf by start_fresh.sh.

[ids]
*

[main]
# Caps Lock is Print Screen, which KDE binds to a Flameshot capture.
capslock = sysrq

[meta]
# Meta+/ opens the context menu at the text cursor (bindings here are sent without Meta).
/ = S-f10
